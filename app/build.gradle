plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp' version '1.9.24-1.0.20'
}

android {
    namespace 'com.hcgstudio.miui.fuck.gesture'
    compileSdk 34

    defaultConfig {
        applicationId "com.hcgstudio.miui.fuck.gesture"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pinned to 1.0.x on purpose: from 1.1.0 on, YukiHookAPI's KSP processor
    // generates an entry class that also implements IXposedHookZygoteInit,
    // which LSPosed has removed and warns about.
    implementation 'com.highcapable.yukihookapi:api:1.0.77'
    ksp 'com.highcapable.yukihookapi:ksp-xposed:1.0.77'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
