plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.hcgstudio.miui.fuck.gesture'
    // The libxposed service artifact requires compileSdk 36.
    compileSdk 36

    defaultConfig {
        applicationId "com.hcgstudio.miui.fuck.gesture"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Modern Xposed API, provided by the framework at runtime.
    compileOnly 'io.github.libxposed:api:101.0.1'
    // Module app side: publishes this module's preferences to the framework.
    implementation 'io.github.libxposed:service:101.0.0'

    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
